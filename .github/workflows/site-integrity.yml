name: Site integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          required=(CNAME index.html robots.txt sitemap.xml README.md vercel.json deploy-marker.json release.json site-data.generated.json manifest.webmanifest assets/style.v2.2.css assets/app.v2.2.js scripts/validate_site.py)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          grep -qx 'achadostube.com.br' CNAME
          grep -q 'Sitemap: https://achadostube.com.br/sitemap.xml' robots.txt

      - name: Validate editorial contracts
        run: python3 scripts/validate_site.py

      - name: Validate JavaScript syntax
        run: node --check assets/app.v2.2.js

      - name: Reject invalid PDFs globally
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' pdf; do
            count=$((count + 1))
            size=$(stat -c%s "$pdf")
            magic=$(head -c 5 "$pdf" || true)
            if [ "$size" -lt 1024 ]; then echo "Invalid PDF (<1 KiB): $pdf ($size bytes)"; failed=1; fi
            if [ "$magic" != '%PDF-' ]; then echo "Invalid PDF signature: $pdf"; failed=1; fi
          done < <(find ebook -type f -name '*.pdf' -print0)
          test "$count" -gt 0
          test "$failed" -eq 0

      - name: Validate canonical-domain hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl --include='*.html' --include='*.xml' --include='*.txt' 'https://www.achadostube.com.br' .; then
            echo 'Found obsolete www canonical URL(s).'
            exit 1
          fi
