name: Site integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          required=(CNAME index.html 404.html autor-arthur-magnus.html robots.txt sitemap.xml feed.xml README.md deploy-marker.json release.json route-shims.generated.json site-data.generated.json manifest.webmanifest _redirects assets/style.v2.2.5.css assets/app.v2.2.5.js assets/route-recovery.v1.js scripts/validate_site.py scripts/test-route-recovery.cjs scripts/generate-route-shims.py)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          grep -qx 'achadostube.com.br' CNAME
          grep -q 'Sitemap: https://achadostube.com.br/sitemap.xml' robots.txt
          test ! -e vercel.json || { echo 'Stale vercel.json found: production host is GitHub Pages'; exit 1; }

      - name: Validate GitHub Pages hosting truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          marker=json.loads(Path('deploy-marker.json').read_text(encoding='utf-8'))
          expected={
              'schema':'freedom-book-deploy-marker-v1',
              'repository':'carloskk07/shopee',
              'branch':'main',
              'origin':'https://achadostube.com.br/',
              'provider':'github-pages',
              'source':'main',
          }
          for key,value in expected.items():
              if marker.get(key)!=value:
                  raise SystemExit(f'deploy-marker mismatch: {key}={marker.get(key)!r}, expected {value!r}')
          print('GitHub Pages hosting truth is valid')
          PY
          if grep -RIl --include='*.html' '/_vercel/image' .; then
            echo 'Found Vercel-only image endpoint in GitHub Pages production HTML.'
            exit 1
          fi

      - name: Validate editorial, SEO, visual-context and release contracts
        run: python3 scripts/validate_site.py

      - name: Validate JavaScript syntax
        run: node --check assets/app.v2.2.5.js

      - name: Validate route-recovery syntax
        run: node --check assets/route-recovery.v1.js

      - name: Validate aliases, trailing slashes and open-redirect safety
        run: node scripts/test-route-recovery.cjs

      - name: Validate deterministic static route shims
        run: python3 scripts/generate-route-shims.py --check

      - name: Enforce versioned asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('release.json').read_text(encoding='utf-8'))
          active=[Path(p) for p in release.get('artifacts',{}) if p.endswith('.html')]
          if not active: raise SystemExit('release has no active HTML artifacts')
          old=('/assets/style.v2.2.css','/assets/app.v2.2.js','/assets/style.v2.2.3.css','/assets/app.v2.2.3.js','/assets/style.v2.2.4.css','/assets/app.v2.2.4.js')
          for path in active:
              text=path.read_text(encoding='utf-8')
              if any(token in text for token in old):
                  raise SystemExit(f'stale active asset reference: {path}')
              if '/assets/style.v2.2.5.css' not in text or '/assets/app.v2.2.5.js' not in text:
                  raise SystemExit(f'missing V2.2.5 asset reference: {path}')
          print('V2.2.5 versioned asset references are coherent across',len(active),'release HTML files')
          PY

      - name: Enforce mobile delivery budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          limits={
              Path('assets/style.v2.2.5.css'):40*1024,
              Path('assets/app.v2.2.5.js'):24*1024,
              Path('index.html'):100*1024,
              Path('autor-arthur-magnus.html'):40*1024,
              Path('feed.xml'):32*1024,
              Path('sitemap.xml'):32*1024,
          }
          for path,limit in limits.items():
              size=path.stat().st_size
              if size>limit: raise SystemExit(f'asset budget exceeded: {path} = {size} > {limit}')
              print('BUDGET OK',path,size,'/',limit)
          for path in Path('.').glob('*.html'):
              if path.stat().st_size>100*1024: raise SystemExit(f'HTML budget exceeded: {path} = {path.stat().st_size}')
          for path in Path('assets/covers').glob('*.webp'):
              if path.stat().st_size>150*1024: raise SystemExit(f'WebP cover budget exceeded: {path} = {path.stat().st_size}')
          for path in Path('assets/icons').glob('*.png'):
              if path.stat().st_size>400*1024: raise SystemExit(f'PWA icon budget exceeded: {path} = {path.stat().st_size}')
          print('Mobile delivery budgets are within limits')
          PY

      - name: Reject invalid PDFs globally
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' pdf; do
            count=$((count + 1))
            size=$(stat -c%s "$pdf")
            magic=$(head -c 5 "$pdf" || true)
            if [ "$size" -lt 1024 ]; then echo "Invalid PDF (<1 KiB): $pdf ($size bytes)"; failed=1; fi
            if [ "$magic" != '%PDF-' ]; then echo "Invalid PDF signature: $pdf"; failed=1; fi
          done < <(find ebook -type f -name '*.pdf' -print0)
          test "$count" -gt 0
          test "$failed" -eq 0

      - name: Validate canonical-domain hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl --include='*.html' --include='*.xml' --include='*.txt' 'https://www.achadostube.com.br' .; then
            echo 'Found obsolete www canonical URL(s).'
            exit 1
          fi
