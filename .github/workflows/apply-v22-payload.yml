name: Apply V2.2 payload

on:
  push:
    branches: ["feat/freedom-book-v2-2-production"]
    paths: [".v22-payload.b64"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand validated V2.2 payload
        shell: bash
        run: |
          set -euo pipefail
          test -s .v22-payload.b64
          base64 -d .v22-payload.b64 > /tmp/v22.tar.gz
          tar -xzf /tmp/v22.tar.gz -C .
          rm -f .v22-payload.b64 .github/workflows/apply-v22-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Freedom Book V2.2 production candidate"
          git push origin HEAD:feat/freedom-book-v2-2-production
