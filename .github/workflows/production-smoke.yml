name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freedom-book-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v5

      - name: Wait for exact release to reach production
        shell: bash
        run: |
          set -euo pipefail
          base="https://achadostube.com.br"
          matched=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
              "$base/release.json?probe=$GITHUB_SHA-$attempt" -o /tmp/public-release.json; then
              if cmp -s release.json /tmp/public-release.json; then
                echo "Production release.json matches approved main on attempt $attempt."
                matched=1
                break
              fi
            fi
            echo "Attempt $attempt/30: production release has not converged yet."
            sleep 20
          done
          test "$matched" -eq 1

      - name: Wait for maintenance campaign to reach production
        shell: bash
        run: |
          set -euo pipefail
          base="https://achadostube.com.br"
          test -s maintenance-marker.json
          matched=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
              "$base/maintenance-marker.json?probe=$GITHUB_SHA-$attempt" -o /tmp/public-maintenance.json; then
              if cmp -s maintenance-marker.json /tmp/public-maintenance.json; then
                echo "Production maintenance marker matches approved main on attempt $attempt."
                matched=1
                break
              fi
            fi
            echo "Attempt $attempt/30: maintenance campaign has not converged yet."
            sleep 20
          done
          test "$matched" -eq 1

      - name: Verify complete production artifact parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          base='https://achadostube.com.br'
          rel=json.loads(pathlib.Path('release.json').read_text())
          artifacts=rel.get('artifacts',{})
          if len(artifacts) < 49:
              raise SystemExit(f'release contract unexpectedly small: {len(artifacts)} artifacts')
          def public_path(path):
              if path == 'index.html': return '/'
              if path == '404.html': return '/404.html'
              if path.endswith('.html'): return '/' + path[:-5]
              return '/' + path
          for path,expected in artifacts.items():
              url=base+public_path(path)
              req=urllib.request.Request(url,headers={'User-Agent':'FreedomBook-Production-Smoke/2.2.5'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read(); ctype=(r.headers.get('Content-Type') or '').lower()
              if path.endswith('.html') and 'text/html' not in ctype: raise SystemExit(f'bad HTML content-type {path}: {ctype}')
              if path.endswith('.css') and 'text/css' not in ctype: raise SystemExit(f'bad CSS content-type {path}: {ctype}')
              if path.endswith('.js') and 'javascript' not in ctype: raise SystemExit(f'bad JS content-type {path}: {ctype}')
              if path.endswith('.webp') and 'image/webp' not in ctype: raise SystemExit(f'bad WebP content-type {path}: {ctype}')
              if path.endswith('.png') and 'image/png' not in ctype: raise SystemExit(f'bad PNG content-type {path}: {ctype}')
              if path.endswith('.xml') and 'xml' not in ctype: raise SystemExit(f'bad XML content-type {path}: {ctype}')
              actual=hashlib.sha256(body).hexdigest()
              if actual!=expected: raise SystemExit(f'hash mismatch {path}: {actual} != {expected}')
              print('OK',path,public_path(path),len(body),actual)
          PY

      - name: Verify GitHub Pages hosting provenance
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            'https://achadostube.com.br/deploy-marker.json' -o /tmp/deploy-marker.json
          python3 - <<'PY'
          import json
          marker=json.load(open('/tmp/deploy-marker.json',encoding='utf-8'))
          expected={'schema':'freedom-book-deploy-marker-v1','repository':'carloskk07/shopee','branch':'main','origin':'https://achadostube.com.br/','provider':'github-pages','source':'main'}
          for key,value in expected.items():
              if marker.get(key)!=value: raise SystemExit(f'production deploy-marker mismatch: {key}={marker.get(key)!r}, expected {value!r}')
          print('Production hosting provenance: GitHub Pages / main')
          PY

      - name: Verify discovery, contextual identity and canonical public routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://achadostube.com.br"
          for path in / /sitemap.xml /feed.xml /robots.txt /manifest.webmanifest /autor-arthur-magnus /guias /proposito-maior /o-cansaco-invisivel /privacidade /termos; do
            echo "Checking $path"
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$base$path" -o /tmp/route-body
            test -s /tmp/route-body
          done
          curl --fail --silent --show-error --location "$base/" -o /tmp/home.html
          curl --fail --silent --show-error --location "$base/autor-arthur-magnus" -o /tmp/author.html
          grep -q '/assets/style.v2.2.5.css' /tmp/home.html
          grep -q '/assets/app.v2.2.5.js' /tmp/home.html
          grep -q '/autor-arthur-magnus' /tmp/home.html
          grep -q 'href="/guias"' /tmp/home.html
          grep -q '/assets/covers/logo-freedom-book-redonda.webp' /tmp/author.html
          grep -q 'fonts.googleapis.com' /tmp/author.html
          grep -q 'id="consentBanner"' /tmp/author.html
          grep -q 'id="cookiePrefs"' /tmp/author.html
          grep -q 'property="og:title"' /tmp/author.html
          ! grep -q '/assets/style.v2.2.4.css' /tmp/home.html
          ! grep -q '/assets/app.v2.2.4.js' /tmp/home.html
          ! grep -q '/assets/style.v2.2.3.css' /tmp/home.html
          ! grep -q '/assets/app.v2.2.3.js' /tmp/home.html
          ! grep -q '/assets/style.v2.2.css' /tmp/home.html
          ! grep -q '/assets/app.v2.2.js' /tmp/home.html

      - name: Verify Google SEO/indexation semantics
        shell: bash
        run: |
          set -euo pipefail
          base="https://achadostube.com.br"
          curl --fail --silent --show-error --location "$base/autor-arthur-magnus?probe=$GITHUB_SHA" -o /tmp/seo-author.html
          curl --fail --silent --show-error --location "$base/proposito-maior?probe=$GITHUB_SHA" -o /tmp/seo-book.html
          curl --fail --silent --show-error --location "$base/sitemap.xml?probe=$GITHUB_SHA" -o /tmp/seo-sitemap.xml
          curl --fail --silent --show-error --location "$base/site-data.generated.json?probe=$GITHUB_SHA" -o /tmp/seo-data.json
          grep -q '"@type":"ProfilePage"' /tmp/seo-author.html
          grep -q '"@type":"BreadcrumbList"' /tmp/seo-author.html
          grep -q '"mainEntity":{"@id":"https://achadostube.com.br/autor-arthur-magnus#person"}' /tmp/seo-author.html
          grep -q 'href="/proposito-maior"' /tmp/seo-author.html
          grep -q 'href="/o-peso-de-ser-forte-o-tempo-todo"' /tmp/seo-author.html
          grep -q 'https://achadostube.com.br/assets/covers/capa-proposito-maior.webp' /tmp/seo-book.html
          ! grep -q 'https://achadostube.com.br/imagens/capa-proposito-maior.png' /tmp/seo-book.html
          ! grep -q 'https://achadostube.com.br/imagens/logo-freedom-book-redonda.png' /tmp/home.html
          grep -q '2026-09-09' /tmp/seo-data.json
          test "$(grep -o '<lastmod>2026-09-09</lastmod>' /tmp/seo-sitemap.xml | wc -l)" -eq 19
          ! grep -q '<loc>https://achadostube.com.br/codigo-da-vida-inabalavel</loc>' /tmp/seo-sitemap.xml

      - name: Verify topical authority guides in production
        shell: bash
        run: |
          set -euo pipefail
          base="https://achadostube.com.br"
          paths=(
            /guias
            /guias/como-encontrar-proposito-na-vida
            /guias/como-melhorar-o-foco-e-reduzir-distracoes
            /guias/como-criar-disciplina-sem-depender-de-motivacao
            /guias/como-recomecar-com-mais-clareza
            /guias/como-simplificar-uma-rotina-que-ficou-pesada
            /guias/como-organizar-a-mente-quando-ha-excesso-de-estimulos
          )
          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --location "$base$path?probe=$GITHUB_SHA" -o /tmp/guide.html
            grep -q 'index,follow' /tmp/guide.html
            grep -q 'rel="canonical"' /tmp/guide.html
            grep -q '/assets/editorial-guides.v1.css' /tmp/guide.html
          done
          curl --fail --silent --show-error --location "$base/guias/como-melhorar-o-foco-e-reduzir-distracoes?probe=$GITHUB_SHA" -o /tmp/article.html
          grep -q '"@type":"Article"' /tmp/article.html
          grep -q '"author":{"@id":"https://achadostube.com.br/#organization"}' /tmp/article.html
          grep -q 'href="/foco-que-gera-resultados"' /tmp/article.html
          grep -q 'Guia editorial da Freedom Book' /tmp/article.html

      - name: Verify hardened legacy public surfaces
        shell: bash
        run: |
          set -euo pipefail
          base="https://achadostube.com.br"

          curl --fail --silent --show-error "$base/leitor.html?probe=$GITHUB_SHA" -o /tmp/reader.html
          grep -qi 'noindex' /tmp/reader.html
          grep -q 'https://achadostube.com.br/o-cansaco-invisivel' /tmp/reader.html
          grep -q 'url=/o-cansaco-invisivel' /tmp/reader.html
          ! grep -q 'googletagmanager.com' /tmp/reader.html
          ! grep -q 'analytics.tiktok.com' /tmp/reader.html
          ! grep -q 'o_cansaco_invisivel.pdf' /tmp/reader.html

          for slug in kit-3-pares kit-sandalias-infantil; do
            curl --fail --silent --show-error "$base/$slug?probe=$GITHUB_SHA" -o "/tmp/$slug.html"
            grep -q "https://achadostube.com.br/$slug" "/tmp/$slug.html"
            grep -q '/assets/legacy-offer.v1.css' "/tmp/$slug.html"
            grep -q '/assets/legacy-consent.v1.js' "/tmp/$slug.html"
            grep -q 'sponsored noopener noreferrer' "/tmp/$slug.html"
            ! grep -q 'googletagmanager.com/gtag/js' "/tmp/$slug.html"
            ! grep -q 'analytics.tiktok.com' "/tmp/$slug.html"
            ! grep -q 'R$' "/tmp/$slug.html"
            ! grep -Eqi 'vendidos hoje|unidades restantes|estoque quase zerado|estão vendo esta oferta agora|mães reais|oferta relâmpago|últimas unidades|garantia 30 dias' "/tmp/$slug.html"
          done

          curl --fail --silent --show-error "$base/assets/legacy-consent.v1.js?probe=$GITHUB_SHA" -o /tmp/legacy-consent.js
          grep -q 'freedom_book_consent_v2' /tmp/legacy-consent.js
          grep -q 'affiliate_click' /tmp/legacy-consent.js
          grep -q 'clearOptionalCookies' /tmp/legacy-consent.js
          ! grep -q 'Purchase' /tmp/legacy-consent.js

          curl --fail --silent --show-error "$base/kit-tenis-sandalia.html?probe=$GITHUB_SHA" -o /tmp/duplicate-kit.html
          grep -qi 'noindex' /tmp/duplicate-kit.html
          grep -q 'https://achadostube.com.br/kit-3-pares' /tmp/duplicate-kit.html
          grep -q 'url=/kit-3-pares' /tmp/duplicate-kit.html

          curl --fail --silent --show-error "$base/locked/the_select.html?probe=$GITHUB_SHA" -o /tmp/retired-select.html
          grep -qi 'noindex,nofollow,noarchive' /tmp/retired-select.html
          ! grep -q 'theselect.com.br' /tmp/retired-select.html
          ! grep -q 'example.com' /tmp/retired-select.html
          ! grep -q 'googletagmanager.com' /tmp/retired-select.html
          ! grep -q 'analytics.tiktok.com' /tmp/retired-select.html

      - name: Verify optimized static media and PWA icons
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            'https://achadostube.com.br/assets/covers/capa-proposito-maior.webp' -D /tmp/image-headers -o /tmp/cover.webp
          test "$(wc -c < /tmp/cover.webp)" -gt 1000
          test "$(head -c 4 /tmp/cover.webp)" = 'RIFF'
          test "$(dd if=/tmp/cover.webp bs=1 skip=8 count=4 status=none)" = 'WEBP'
          grep -Eqi '^content-type: image/webp' /tmp/image-headers
          for icon in icon-192.png icon-512.png maskable-512.png apple-touch-icon.png; do
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
              "https://achadostube.com.br/assets/icons/$icon" -D /tmp/icon-headers -o /tmp/icon.png
            test "$(wc -c < /tmp/icon.png)" -gt 1000
            test "$(head -c 8 /tmp/icon.png | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
            grep -Eqi '^content-type: image/png' /tmp/icon-headers
          done

      - name: Verify a published PDF is real
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            'https://achadostube.com.br/ebook/o-cansaco-invisivel.pdf' -o /tmp/book.pdf
          test "$(head -c 5 /tmp/book.pdf)" = '%PDF-'
          test "$(wc -c < /tmp/book.pdf)" -gt 1024
