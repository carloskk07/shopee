name: Refresh cover-integrity contract

on:
  push:
    branches: ["fix/v2-2-6-cover-integrity"]
    paths: [".cover-contract/READY"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/refresh_cover_contract.py
      - run: python3 scripts/validate_site.py
      - name: Commit refreshed contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cover-contract
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_site.py release.json
          git commit -m "test: guard every book-cover rendering surface"
          git push origin HEAD:fix/v2-2-6-cover-integrity
