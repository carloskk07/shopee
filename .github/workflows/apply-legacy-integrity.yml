name: Apply legacy surface integrity hardening

on:
  push:
    branches:
      - fix/legacy-surface-integrity
    paths:
      - .legacy-integrity-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harden_legacy_surfaces.py
          node --check assets/legacy-consent.v1.js
          python3 scripts/validate_site.py

      - name: Commit non-workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .legacy-integrity-ready
          git rm scripts/harden_legacy_surfaces.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden legacy public surfaces and remove deceptive telemetry"
          git push origin HEAD:fix/legacy-surface-integrity
