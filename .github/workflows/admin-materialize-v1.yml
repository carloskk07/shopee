name: Admin materialize v1

on:
  push:
    branches: [admin/freedom-control-center-v1]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Materialize validated admin sources
        shell: bash
        env:
          APP_GZ: ''
          RELEASE_GZ: ''
          README_GZ: ''
          VALIDATOR_GZ: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,gzip,pathlib
          files={
            'admin/app.js':'APP_GZ',
            'admin/release.json':'RELEASE_GZ',
            'admin/README.md':'README_GZ',
            'scripts/validate_admin.py':'VALIDATOR_GZ',
          }
          for path,key in files.items():
            p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True)
            p.write_bytes(gzip.decompress(base64.b64decode(os.environ[key])))
            print(path,p.stat().st_size)
          PY
          node --check admin/app.js
          python3 -m py_compile scripts/validate_admin.py
          python3 scripts/validate_admin.py
      - name: Commit materialized sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/app.js admin/release.json admin/README.md scripts/validate_admin.py
          git commit -m 'admin: materializar control center v1'
          git push origin HEAD:admin/freedom-control-center-v1
