name: Fast impact O Peso

on:
  push:
    branches: [seo/fastest-impact-o-peso]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/fastest-impact-o-peso
          fetch-depth: 0

      - name: Apply evidence-led landing optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          path = Path('o-peso-de-ser-forte-o-tempo-todo.html')
          text = path.read_text(encoding='utf-8')

          old_title = 'O Peso de Ser Forte o Tempo Todo — e-book gratuito | Freedom Book'
          new_title = 'O Peso de Ser Forte o Tempo Todo | Livro grátis de Arthur Magnus'
          if text.count(old_title) < 4:
              raise SystemExit(f'expected title occurrences not found: {text.count(old_title)}')
          text = text.replace(old_title, new_title)

          old_meta = 'Uma leitura sobre excesso de responsabilidade, limites pessoais e a importância de reconhecer quando a rotina ficou pesada demais. Leia gratuitamente em PDF, sem cadastro obrigatório.'
          new_meta = 'Leia O Peso de Ser Forte o Tempo Todo, livro gratuito de Arthur Magnus sobre excesso de responsabilidade, limites e rotina. PDF grátis e sem cadastro.'
          if text.count(old_meta) != 3:
              raise SystemExit(f'expected social/meta description occurrences not found: {text.count(old_meta)}')
          text = text.replace(old_meta, new_meta)

          marker = '</section><section class="section alt"><div class="container"><div class="section-head"><span class="kicker">Temas da leitura</span>'
          if text.count(marker) != 1:
              raise SystemExit(f'unique insertion marker not found: {text.count(marker)}')
          insert = '''</section><section class="section"><div class="container"><div class="card"><div class="section-head"><span class="kicker">Sobre o livro</span><h2>O Peso de Ser Forte o Tempo Todo, de Arthur Magnus</h2><p>Esta é a página oficial do livro <strong>O Peso de Ser Forte o Tempo Todo</strong>, de <a href="/autor-arthur-magnus">Arthur Magnus</a>, publicado pela Freedom Book e disponível gratuitamente em PDF.</p></div><p>A leitura parte de uma situação comum: continuar assumindo responsabilidades mesmo quando a rotina já ficou pesada. Em vez de tratar força como uma obrigação permanente, o livro convida a observar limites pessoais, excesso de responsabilidades e prioridades que talvez precisem ser reorganizadas.</p><p>É uma leitura editorial e reflexiva para quem quer compreender melhor esse tipo de sobrecarga no cotidiano. O PDF completo pode ser lido sem cadastro; nesta página você também encontra o contexto da obra, o autor e um guia complementar para simplificar uma rotina que ficou pesada.</p></div></div></section><section class="section alt"><div class="container"><div class="section-head"><span class="kicker">Temas da leitura</span>'''
          text = text.replace(marker, insert)
          path.write_text(text, encoding='utf-8')

          release_path = Path('release.json')
          release_text = release_path.read_text(encoding='utf-8')
          release = json.loads(release_text)
          key = 'o-peso-de-ser-forte-o-tempo-todo.html'
          old_hash = release['artifacts'][key]
          new_hash = hashlib.sha256(path.read_bytes()).hexdigest()
          if old_hash == new_hash:
              raise SystemExit('HTML hash unexpectedly unchanged')
          needle = f'"{key}": "{old_hash}"'
          replacement = f'"{key}": "{new_hash}"'
          if release_text.count(needle) != 1:
              raise SystemExit('release hash entry not uniquely found')
          release_path.write_text(release_text.replace(needle, replacement), encoding='utf-8')

          print('UPDATED', key)
          print('OLD_HASH', old_hash)
          print('NEW_HASH', new_hash)
          PY

      - name: Run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_hashes.py --changed-only
          python3 scripts/validate_site.py
          python3 scripts/validate_seo.py
          python3 scripts/validate_guides.py
          python3 scripts/test_seo_intelligence.py
          node --check assets/app.v2.2.5.js
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check

      - name: Commit optimized landing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add o-peso-de-ser-forte-o-tempo-todo.html release.json
          git diff --cached --check
          git commit -m 'seo: otimizar landing O Peso com evidência GSC'
          git push origin HEAD:seo/fastest-impact-o-peso
