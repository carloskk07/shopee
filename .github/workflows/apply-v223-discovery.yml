name: Apply Freedom Book V2.2.3 discovery campaign

on:
  push:
    branches: ["perf/v2-2-3-discovery-cache-funnel"]
    paths: [".v223-ready"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout campaign branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build V2.2.3 cache, funnel and discovery hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib, html, xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          ROOT=Path('.')
          OLD='2026.09.08-v2.2.2'
          NEW='2026.09.08-v2.2.3'
          old_css='/assets/style.v2.2.css'
          old_js='/assets/app.v2.2.js'
          new_css='/assets/style.v2.2.3.css'
          new_js='/assets/app.v2.2.3.js'

          editorial=[
            'index.html','404.html','a-vida-que-voce-adiou.html','codigo-da-vida-inabalavel.html',
            'disciplina-e-liberdade.html','foco-que-gera-resultados.html','mente-forte-vida-leve.html',
            'o-cansaco-invisivel.html','o-metodo-da-vida-mais-leve.html','o-peso-de-ser-forte-o-tempo-todo.html',
            'privacidade.html','proposito-maior.html','quando-sua-vida-virou-sobrevivencia.html',
            'recomecos-sao-escolhas.html','termos.html'
          ]

          css=(ROOT/'assets/style.v2.2.css').read_text('utf-8')
          css += '\n/* V2.2.3 discovery/cache hardening */\n.author-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:22px}.author-avatar{width:88px;height:88px;border-radius:50%;border:1px solid var(--line2);object-fit:cover}.author-card h2{margin:0 0 6px}.author-card p{margin:0;color:var(--muted)}\n'
          (ROOT/'assets/style.v2.2.3.css').write_text(css,'utf-8')

          js=(ROOT/'assets/app.v2.2.js').read_text('utf-8')
          js=js.replace(f'release:"{OLD}"',f'release:"{NEW}"')
          anchor='  function track(name,params={}){\n'
          helper='''  const coarseTrafficSource=()=>{\n    try{\n      if(!document.referrer)return "direct";\n      const h=new URL(document.referrer).hostname.toLowerCase();\n      if(h===location.hostname)return "internal";\n      if(/google\\.|bing\\.|duckduckgo\\.|yahoo\\.|brave\\./.test(h))return "search";\n      if(/instagram\\.|facebook\\.|tiktok\\.|youtube\\.|x\\.com$|twitter\\.|whatsapp\\./.test(h))return "social";\n      return "referral";\n    }catch(_){return "unknown"}\n  };\n  const funnelMeta=()=>({release:CONFIG.release,traffic_source:coarseTrafficSource(),page_type:document.body?.dataset?.pageType||"page"});\n'''
          if helper not in js:
              js=js.replace(anchor,helper+anchor)
          js=js.replace('window.gtag("event",name,params);','window.gtag("event",name,{...funnelMeta(),...params});')
          js=js.replace('window.ttq?.track)try{window.ttq.track(name,params)}','window.ttq?.track)try{window.ttq.track(name,{...funnelMeta(),...params})}')
          old='search?.addEventListener("input",()=>{forcedSlugs=null;apply()});'
          new='''let searchTimer=null;\n    search?.addEventListener("input",()=>{\n      forcedSlugs=null;apply();clearTimeout(searchTimer);\n      searchTimer=setTimeout(()=>{const q=norm(search.value||"");if(q)track("catalog_search",{query_length:q.length,result_count:cards.filter(c=>!c.hidden).length})},450);\n    });'''
          js=js.replace(old,new)
          (ROOT/'assets/app.v2.2.3.js').write_text(js,'utf-8')

          for name in editorial:
              p=ROOT/name
              text=p.read_text('utf-8')
              text=text.replace(OLD,NEW).replace(old_css,new_css).replace(old_js,new_js)
              if 'rel="alternate" type="application/atom+xml"' not in text:
                  text=text.replace('<link href="/manifest.webmanifest" rel="manifest"/>','<link href="/manifest.webmanifest" rel="manifest"/><link href="/feed.xml" rel="alternate" type="application/atom+xml" title="Freedom Book — novos e-books"/>')
              if name=='index.html':
                  text=text.replace('<body>','<body data-page-type="home">',1)
              elif name not in {'404.html','privacidade.html','termos.html','codigo-da-vida-inabalavel.html'}:
                  text=text.replace('<body>','<body data-page-type="book">',1)
                  text=text.replace('"author":{"@type":"Person","name":"Arthur Magnus"}', '"author":{"@type":"Person","@id":"https://achadostube.com.br/autor-arthur-magnus#person","name":"Arthur Magnus","url":"https://achadostube.com.br/autor-arthur-magnus"}')
                  text=text.replace('"publisher":{"@type":"Organization","name":"Freedom Book","url":"https://achadostube.com.br/"}', '"publisher":{"@type":"Organization","@id":"https://achadostube.com.br/#organization","name":"Freedom Book","url":"https://achadostube.com.br/"}')
              p.write_text(text,'utf-8')

          hp=ROOT/'index.html'; home=hp.read_text('utf-8')
          if 'https://achadostube.com.br/autor-arthur-magnus#person' not in home:
              home=home.replace('{"@type":"WebSite","@id":"https://achadostube.com.br/#website"', '{"@type":"Person","@id":"https://achadostube.com.br/autor-arthur-magnus#person","name":"Arthur Magnus","url":"https://achadostube.com.br/autor-arthur-magnus"},{"@type":"WebSite","@id":"https://achadostube.com.br/#website"')
          if 'href="/autor-arthur-magnus"' not in home:
              home=home.replace('<a href="/termos">Termos</a>','<a href="/autor-arthur-magnus">Autor</a><a href="/termos">Termos</a>')
          hp.write_text(home,'utf-8')

          author='''<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="freedom-book-release" content="'''+NEW+'''"/><title>Arthur Magnus — autor da Freedom Book</title><meta name="description" content="Conheça Arthur Magnus, autor dos e-books publicados pela Freedom Book sobre propósito, foco, disciplina, recomeços, clareza mental e vida prática."/><meta name="robots" content="index,follow,max-image-preview:large"/><meta name="theme-color" content="#050609"/><link rel="canonical" href="https://achadostube.com.br/autor-arthur-magnus"/><link rel="stylesheet" href="'''+new_css+'''"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="alternate" type="application/atom+xml" title="Freedom Book — novos e-books" href="/feed.xml"/><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Person","@id":"https://achadostube.com.br/autor-arthur-magnus#person","name":"Arthur Magnus","url":"https://achadostube.com.br/autor-arthur-magnus","worksFor":{"@id":"https://achadostube.com.br/#organization"}},{"@type":"WebPage","@id":"https://achadostube.com.br/autor-arthur-magnus#webpage","url":"https://achadostube.com.br/autor-arthur-magnus","name":"Arthur Magnus — autor da Freedom Book","inLanguage":"pt-BR","about":{"@id":"https://achadostube.com.br/autor-arthur-magnus#person"}}]}</script></head><body data-page-type="author"><a class="skip" href="#conteudo">Pular para o conteúdo</a><header class="nav" id="mainNav"><div class="container"><div class="nav-row"><a class="brand" href="/" aria-label="Freedom Book — início"><img src="/assets/covers/logo-freedom-book-redonda.webp" width="38" height="38" alt=""/><span>Freedom <span>Book</span></span></a><nav class="nav-links" aria-label="Navegação principal"><a href="/#comece">Comece por aqui</a><a href="/#catalogo">Catálogo</a><a href="/#manifesto">Manifesto</a></nav><div class="nav-actions"><a class="btn small secondary nav-hide" href="/#catalogo">Ver livros</a><button id="menuBtn" class="menu-btn" type="button" aria-controls="mobileMenu" aria-expanded="false" aria-label="Abrir menu">☰</button></div></div><nav id="mobileMenu" class="mobile-menu" aria-label="Navegação mobile"><a href="/">Início</a><a href="/#catalogo">Catálogo</a><a href="/#manifesto">Manifesto</a></nav></div></header><main id="conteudo"><div class="container crumbs"><a href="/">Freedom Book</a> / Arthur Magnus</div><section class="section"><div class="container"><article class="card author-card"><img class="author-avatar" src="/assets/covers/logo-freedom-book-redonda.webp" width="88" height="88" alt="Freedom Book"/><div><span class="kicker">Autor</span><h1 style="font-size:clamp(2.2rem,5vw,4rem);margin:12px 0">Arthur Magnus</h1><p class="lead">Arthur Magnus é o nome de autoria dos e-books publicados pela Freedom Book. O catálogo reúne materiais gratuitos em PDF sobre propósito, foco, disciplina, recomeços, clareza mental e vida prática.</p><div class="hero-actions"><a class="btn" href="/#catalogo" data-track="author_catalog">Explorar os e-books</a><a class="btn secondary" href="https://whatsapp.com/channel/0029Vb84nsQHgZWYKx7syI2O" target="_blank" rel="noopener noreferrer" data-track="author_channel">Acompanhar lançamentos</a></div></div></article></div></section><section class="section alt"><div class="container"><div class="section-head"><span class="kicker">Biblioteca</span><h2>Leituras publicadas</h2><p>Os títulos disponíveis gratuitamente podem ser acessados pelo catálogo principal da Freedom Book.</p></div><div class="card" style="padding:24px;text-align:center"><a class="btn" href="/#catalogo">Abrir catálogo completo</a></div></div></section></main><footer class="footer"><div class="container"><div class="footer-row"><div><strong>Freedom Book</strong><div class="footer-small">Editora digital independente</div></div><div class="footer-links"><a href="/">Início</a><a href="/#catalogo">E-books</a><a href="/privacidade">Privacidade</a><a href="/termos">Termos</a></div></div></div></footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script defer src="'''+new_js+'''"></script></body></html>'''
          (ROOT/'autor-arthur-magnus.html').write_text(author,'utf-8')

          data=json.loads((ROOT/'site-data.generated.json').read_text('utf-8'))
          data['site']['release']=NEW
          (ROOT/'site-data.generated.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n','utf-8')
          entries=[]
          for b in data['books']:
              if not b.get('available'): continue
              entries.append(f'''  <entry><title>{html.escape(b['title'])}</title><id>{b['pageUrl']}</id><link href="{b['pageUrl']}"/><updated>2026-09-08T00:00:00-03:00</updated><summary>{html.escape(b['description'])}</summary><author><name>Arthur Magnus</name></author></entry>''')
          feed='''<?xml version="1.0" encoding="utf-8"?>\n<feed xmlns="http://www.w3.org/2005/Atom"><title>Freedom Book — novos e-books</title><id>https://achadostube.com.br/</id><link href="https://achadostube.com.br/feed.xml" rel="self"/><link href="https://achadostube.com.br/"/><updated>2026-09-08T00:00:00-03:00</updated><author><name>Arthur Magnus</name></author>\n'''+"\n".join(entries)+'''\n</feed>\n'''
          (ROOT/'feed.xml').write_text(feed,'utf-8')

          ns='http://www.sitemaps.org/schemas/sitemap/0.9'; ins='http://www.google.com/schemas/sitemap-image/1.1'
          ET.register_namespace('',ns); ET.register_namespace('image',ins)
          root=ET.Element('{%s}urlset'%ns)
          routes=[('/',None),('/autor-arthur-magnus',None)]
          routes += [(urlparse(b['pageUrl']).path,b) for b in data['books'] if b.get('available')]
          for path,b in routes:
              u=ET.SubElement(root,'{%s}url'%ns); ET.SubElement(u,'{%s}loc'%ns).text='https://achadostube.com.br'+path; ET.SubElement(u,'{%s}lastmod'%ns).text='2026-09-08'
              if b:
                  im=ET.SubElement(u,'{%s}image'%ins); ET.SubElement(im,'{%s}loc'%ins).text=f"https://achadostube.com.br/assets/covers/capa-{b['slug']}.webp"; ET.SubElement(im,'{%s}title'%ins).text=b['title']
          ET.ElementTree(root).write(ROOT/'sitemap.xml',encoding='utf-8',xml_declaration=True)

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          critical=editorial+['autor-arthur-magnus.html','assets/style.v2.2.3.css','assets/app.v2.2.3.js','manifest.webmanifest','site-data.generated.json','sitemap.xml','feed.xml','deploy-marker.json']
          critical += sorted(str(p) for p in (ROOT/'assets/covers').glob('*.webp'))
          critical += sorted(str(p) for p in (ROOT/'assets/icons').glob('*.png'))
          release={'schema':'freedom-book-release-v1','release':NEW,'publishedFrom':'main','origin':'https://achadostube.com.br','artifacts':{p:sha(p) for p in critical}}
          (ROOT/'release.json').write_text(json.dumps(release,indent=2,ensure_ascii=False)+'\n','utf-8')
          PY

          node --check assets/app.v2.2.3.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/apply-v223-discovery.yml' ':!.v223-ready'
          git commit -m "perf: publish Freedom Book V2.2.3 discovery candidate"
          git push origin HEAD:perf/v2-2-3-discovery-cache-funnel
