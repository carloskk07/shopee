name: Book Publisher V2.1 hardening

on:
  push:
    branches: [admin/book-publisher-v2.1]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply atomic bundle hardening
        run: python3 tmp/harden_book_publisher_v21.py
      - name: Run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_admin.py scripts/validate_site.py scripts/validate_seo.py scripts/generate-route-shims.py
          python3 scripts/validate_admin.py
          node --check admin/app.js
          node --check admin/book-publisher.js
          node scripts/test_admin_v2.js
          python3 scripts/release_hashes.py --changed-only
          python3 scripts/validate_site.py
          python3 scripts/validate_seo.py
          python3 scripts/validate_guides.py
          python3 scripts/test_seo_intelligence.py
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check
      - name: Commit hardened product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin scripts/validate_admin.py scripts/test_admin_v2.js scripts/validate_site.py
          git diff --cached --check
          git commit -m 'fix: tornar bundle de livro atômico no preflight'
          git push origin HEAD:${GITHUB_REF_NAME}
