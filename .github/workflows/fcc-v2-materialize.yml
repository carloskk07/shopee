name: FCC V2 materialize

on:
  push:
    branches: [admin/freedom-control-center-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify, materialize and validate V2
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/fcc-v2.part* | base64 -d > /tmp/fcc-v2.tar.gz
          echo '78808e1edf5cd18c25c0490dff0ddaff1d32c918c848fac351db2af5ab17956e  /tmp/fcc-v2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fcc-v2.tar.gz -C .
          python3 -m py_compile scripts/validate_admin.py
          python3 scripts/validate_admin.py
          node --check admin/app.js
          node scripts/test_admin_v2.js
          python3 scripts/release_hashes.py --changed-only
          python3 scripts/validate_site.py
          python3 scripts/validate_seo.py
          python3 scripts/validate_guides.py
          python3 scripts/test_seo_intelligence.py
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check
      - name: Commit validated product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/admin-integrity.yml .github/workflows/admin-production-smoke.yml
          git add admin scripts/validate_admin.py scripts/test_admin_v2.js
          git diff --cached --check
          git commit -m 'admin: materializar Freedom Control Center V2'
          git push origin HEAD:${GITHUB_REF_NAME}
