name: Apply staged Freedom Book V2.2

on:
  push:
    branches: ["feat/freedom-book-v2-2"]
    paths: [".v22-stage/READY"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify and expand fixed V2.2 archive
        shell: bash
        run: |
          set -euo pipefail
          archive='.v22-stage/v22.tar.xz'
          test -s "$archive"
          echo '1359e2084400039377aafb89137145d4e1819afa39319ec311fde121795697cd  .v22-stage/v22.tar.xz' | sha256sum -c -
          tar -tJf "$archive" > /tmp/archive-files.txt
          allowed='README.md|index.html|404.html|a-vida-que-voce-adiou.html|codigo-da-vida-inabalavel.html|disciplina-e-liberdade.html|foco-que-gera-resultados.html|mente-forte-vida-leve.html|o-cansaco-invisivel.html|o-metodo-da-vida-mais-leve.html|o-peso-de-ser-forte-o-tempo-todo.html|privacidade.html|proposito-maior.html|quando-sua-vida-virou-sobrevivencia.html|recomecos-sao-escolhas.html|termos.html|assets/style.v2.2.css|assets/app.v2.2.js|site-data.generated.json|manifest.webmanifest|robots.txt|sitemap.xml|vercel.json|release.json|scripts/validate_site.py|.github/workflows/site-integrity.yml|.github/workflows/production-smoke.yml|.github/BRANCH_PROTECTION.md'
          while IFS= read -r path; do
            printf '%s\n' "$path" | grep -Exq "$allowed" || { echo "Unexpected archive path: $path"; exit 1; }
          done < /tmp/archive-files.txt
          tar -xJf "$archive" -C .
          rm -rf .v22-stage .github/workflows/apply-v22-staged.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Freedom Book V2.2 production candidate"
          git push origin HEAD:feat/freedom-book-v2-2
