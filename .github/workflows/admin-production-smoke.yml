name: Admin production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freedom-admin-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v5

      - name: Build exact private admin runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_private_admin.py
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('netlify-admin-dist/admin')
          rel=json.loads((root/'release.json').read_text())
          assert rel['schema']=='freedom-admin-release-v1'
          assert rel['version']=='2.2.0'
          assert rel['hosting']=='netlify-private'
          assert rel['access']=='team-sso'
          assert set(rel['artifacts'])=={'index.html','style.css','app.js','book-publisher.js','control-plane.json','knowledge.json','knowledge-layer.js','operational-brain.js','monetization-intelligence.js','runtime-adapter.js'}
          for cap in ('operational-brain','closed-loop-decisions','decision-ledger','monetization-intelligence','private-monetization-ledger'):
              assert cap in rel['capabilities'],cap
          for path,expected in rel['artifacts'].items():
              body=(root/path).read_bytes(); actual=hashlib.sha256(body).hexdigest()
              if actual!=expected: raise SystemExit(f'private runtime hash mismatch {path}: {actual} != {expected}')
              print('OK',path,len(body),actual)
          idx=(root/'index.html').read_text()
          assert idx.count('/admin/knowledge-layer.js')==1
          assert idx.count('/admin/runtime-adapter.js')==1
          assert idx.count('/admin/operational-brain.js')==1
          assert idx.count('/admin/monetization-intelligence.js')==1
          assert idx.index('/admin/runtime-adapter.js') < idx.index('/admin/app.js')
          app=(root/'app.js').read_text(); brain=(root/'operational-brain.js').read_text(); money=(root/'monetization-intelligence.js').read_text()
          assert '/api/github/publish' in app and '__FCC_SERVER_GITHUB_READY__' in app
          assert '/api/brain/evaluate' in brain and '/api/gsc/data' in brain
          assert '/api/monetization/ledger' in money and 'PRIVATE ECONOMIC LAYER' in money
          print('Private admin runtime + Operational Brain + Monetization Intelligence exact')
          PY

      - name: Wait until public GitHub Pages admin is retired
        shell: bash
        run: |
          set -euo pipefail
          retired=0
          for attempt in $(seq 1 30); do
            code_html="$(curl --silent --location --output /tmp/public-admin.html --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://achadostube.com.br/admin/?probe=$GITHUB_SHA-$attempt" || true)"
            code_js="$(curl --silent --location --output /tmp/public-admin.js --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://achadostube.com.br/admin/app.js?probe=$GITHUB_SHA-$attempt" || true)"
            if [ "$code_html" = "404" ] && [ "$code_js" = "404" ]; then retired=1; break; fi
            sleep 20
          done
          test "$retired" -eq 1

      - name: Verify Netlify anonymous barrier including private backends
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://freedom-book-admin.netlify.app/admin/' \
            'https://freedom-book-admin.netlify.app/api/brain/status' \
            'https://freedom-book-admin.netlify.app/api/audit' \
            'https://freedom-book-admin.netlify.app/api/decision/ledger' \
            'https://freedom-book-admin.netlify.app/api/monetization/ledger'; do
            code="$(curl --silent --location --output /tmp/netlify-private.html --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            echo "$url -> HTTP $code"
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              continue
            fi
            grep -Eqi 'This site is private|Sign in to Netlify|invited Netlify account' /tmp/netlify-private.html
            ! grep -q 'Freedom Control Center · V2' /tmp/netlify-private.html
          done

      - name: Verify public site remains healthy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://achadostube.com.br/' -o /tmp/home.html
          grep -q 'Freedom Book' /tmp/home.html
          curl --fail --silent --show-error --location 'https://achadostube.com.br/release.json' -o /tmp/public-release.json
          cmp -s release.json /tmp/public-release.json
