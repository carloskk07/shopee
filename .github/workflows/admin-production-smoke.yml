name: Admin production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freedom-admin-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v5

      - name: Wait for exact admin release
        shell: bash
        run: |
          set -euo pipefail
          base='https://achadostube.com.br/admin'
          matched=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$base/release.json?probe=$GITHUB_SHA-$attempt" -o /tmp/admin-release.json; then
              if cmp -s admin/release.json /tmp/admin-release.json; then matched=1; break; fi
            fi
            sleep 20
          done
          test "$matched" -eq 1

      - name: Verify admin V2 byte parity and safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          base='https://achadostube.com.br/admin/'
          release=json.loads(pathlib.Path('admin/release.json').read_text())
          assert release['schema']=='freedom-admin-release-v1'
          assert release.get('version')=='2.0.0'
          assert set(release['artifacts'])=={'index.html','style.css','app.js','control-plane.json'}
          for path,expected in release['artifacts'].items():
              req=urllib.request.Request(base+path,headers={'User-Agent':'FreedomAdmin-Smoke/2.0'})
              with urllib.request.urlopen(req,timeout=45) as r: body=r.read()
              actual=hashlib.sha256(body).hexdigest()
              if actual!=expected: raise SystemExit(f'admin hash mismatch {path}: {actual} != {expected}')
              print('OK',path,len(body),actual)
          PY
          curl --fail --silent --show-error --location 'https://achadostube.com.br/admin/' -o /tmp/admin.html
          grep -q 'Freedom Control Center · V2' /tmp/admin.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' /tmp/admin.html
          grep -q 'Content-Security-Policy' /tmp/admin.html
          grep -q 'commandDialog' /tmp/admin.html
          curl --fail --silent --show-error --location 'https://achadostube.com.br/admin/app.js' -o /tmp/admin.js
          grep -q 'opportunityEngine' /tmp/admin.js
          grep -q 'experimentModel' /tmp/admin.js
          grep -q 'freedom-change-set-v2' /tmp/admin.js
          grep -q '/git/refs' /tmp/admin.js
          grep -q '/git/trees' /tmp/admin.js
          grep -q '/pulls' /tmp/admin.js
          ! grep -q 'localStorage' /tmp/admin.js
          curl --fail --silent --show-error --location 'https://achadostube.com.br/admin/control-plane.json' -o /tmp/control-plane.json
          python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/control-plane.json',encoding='utf-8'))
          assert cp['schema']=='freedom-control-plane-v2'
          assert cp['version']=='2.0.0'
          assert cp['publishing']['directMainWrites'] is False
          assert '.github/' in cp['security']['blockedPrefixes']
          assert cp['experiments']
          print('Control plane V2 policy verified')
          PY
