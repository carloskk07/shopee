name: Apply Freedom Book V2.2.5 error corrections

on:
  push:
    branches:
      - fix/v2-2-5-errors
    paths:
      - .v225-fix-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and validate V2.2.5 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v225_fixes.py
          node --check assets/app.v2.2.5.js
          python3 scripts/validate_site.py

      - name: Commit correction candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .v225-fix-ready
          git rm .github/workflows/apply-v225-fixes.yml scripts/apply_v225_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct V2.2.5 visual, consent and telemetry drift"
          git push origin HEAD:fix/v2-2-5-errors
