name: Apply Freedom Book V2.2.5 error corrections

on:
  push:
    branches:
      - fix/v2-2-5-errors
    paths:
      - .v225-fix-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply coherent V2.2.5 corrections
        shell: bash
        run: |
          set -euo pipefail
          cp assets/style.v2.2.4.css assets/style.v2.2.5.css
          cat >> assets/style.v2.2.5.css <<'CSS'

/* Freedom Book V2.2.5 — error-correction hardening */
body::before{-webkit-mask-image:radial-gradient(circle at 50% 12%,#000,transparent 72%)}
CSS
          cp assets/app.v2.2.4.js assets/app.v2.2.5.js

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          OLD_RELEASE='2026.09.08-v2.2.4'
          NEW_RELEASE='2026.09.08-v2.2.5'
          OLD_CSS='/assets/style.v2.2.4.css'
          NEW_CSS='/assets/style.v2.2.5.css'
          OLD_JS='/assets/app.v2.2.4.js'
          NEW_JS='/assets/app.v2.2.5.js'
          CANON='https://achadostube.com.br'

          htmls=[
            'index.html','404.html','autor-arthur-magnus.html','privacidade.html','termos.html',
            'codigo-da-vida-inabalavel.html','proposito-maior.html','recomecos-sao-escolhas.html',
            'foco-que-gera-resultados.html','mente-forte-vida-leve.html','disciplina-e-liberdade.html',
            'o-metodo-da-vida-mais-leve.html','o-cansaco-invisivel.html',
            'quando-sua-vida-virou-sobrevivencia.html','a-vida-que-voce-adiou.html',
            'o-peso-de-ser-forte-o-tempo-todo.html'
          ]

          # Release, active assets and browser chrome must agree with the active visual system.
          for name in htmls:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace(OLD_RELEASE,NEW_RELEASE).replace(OLD_CSS,NEW_CSS).replace(OLD_JS,NEW_JS)
              s=s.replace('#050609','#050505')
              p.write_text(s,encoding='utf-8')

          # Fix visible duplicated taxonomy on the upcoming title.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('Códigos de Vida · Códigos de Vida','Códigos de Vida · Próximo lançamento')
          p.write_text(s,encoding='utf-8')

          # Improve telemetry page classification on non-book surfaces.
          page_types={
              '404.html':'404',
              'privacidade.html':'legal',
              'termos.html':'legal',
              'codigo-da-vida-inabalavel.html':'coming_soon',
          }
          for name,page_type in page_types.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              if '<body>' in s:
                  s=s.replace('<body>',f'<body data-page-type="{page_type}">',1)
              p.write_text(s,encoding='utf-8')

          # Author page had drifted from the shared runtime contract: missing fonts/icons,
          # social metadata, cookie controls and self-contained Organization identity.
          author_path=Path('autor-arthur-magnus.html')
          author=author_path.read_text(encoding='utf-8')
          canonical='<link rel="canonical" href="https://achadostube.com.br/autor-arthur-magnus"/>'
          script_marker='<script type="application/ld+json">'
          ci=author.index(canonical)+len(canonical)
          si=author.index(script_marker,ci)
          head_extra=(
              '<link href="https://fonts.googleapis.com" rel="preconnect"/>'
              '<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>'
              '<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>'
              '<link rel="stylesheet" href="/assets/style.v2.2.5.css"/>'
              '<link href="/assets/favicon.ico" rel="icon" sizes="any"/>'
              '<link href="/assets/icons/apple-touch-icon.png" rel="apple-touch-icon"/>'
              '<link rel="manifest" href="/manifest.webmanifest"/>'
              '<link rel="alternate" type="application/atom+xml" title="Freedom Book — novos e-books" href="/feed.xml"/>'
              '<meta content="pt_BR" property="og:locale"/>'
              '<meta content="profile" property="og:type"/>'
              '<meta content="Arthur Magnus — autor da Freedom Book" property="og:title"/>'
              '<meta content="Conheça Arthur Magnus, autor dos e-books publicados pela Freedom Book sobre propósito, foco, disciplina, recomeços, clareza mental e vida prática." property="og:description"/>'
              '<meta content="https://achadostube.com.br/autor-arthur-magnus" property="og:url"/>'
              '<meta content="Freedom Book" property="og:site_name"/>'
              '<meta content="https://achadostube.com.br/og/freedom-book-home.png" property="og:image"/>'
              '<meta content="Arthur Magnus — Freedom Book" property="og:image:alt"/>'
              '<meta content="summary_large_image" name="twitter:card"/>'
              '<meta content="Arthur Magnus — autor da Freedom Book" name="twitter:title"/>'
              '<meta content="Conheça Arthur Magnus, autor dos e-books publicados pela Freedom Book." name="twitter:description"/>'
              '<meta content="https://achadostube.com.br/og/freedom-book-home.png" name="twitter:image"/>'
          )
          author=author[:ci]+head_extra+author[si:]

          # Make the author's structured data self-contained.
          m=re.search(r'<script type="application/ld\+json">(.*?)</script>',author,re.S)
          if not m: raise SystemExit('author JSON-LD missing')
          structured=json.loads(m.group(1))
          graph=structured.get('@graph',[])
          if not any(x.get('@id')==CANON+'/#organization' for x in graph if isinstance(x,dict)):
              graph.insert(0,{'@type':'Organization','@id':CANON+'/#organization','name':'Freedom Book','url':CANON+'/'})
          structured['@graph']=graph
          author=author[:m.start(1)]+json.dumps(structured,ensure_ascii=False,separators=(',',':'))+author[m.end(1):]

          # Reuse the already-vetted footer and consent controls from the legal page.
          privacy=Path('privacidade.html').read_text(encoding='utf-8')
          fs=privacy.index('<footer class="footer">'); fe=privacy.index('</footer>',fs)+len('</footer>')
          footer=privacy[fs:fe]
          afs=author.index('<footer class="footer">'); afe=author.index('</footer>',afs)+len('</footer>')
          author=author[:afs]+footer+author[afe:]
          cs=privacy.index('<div aria-label="Preferências de privacidade"')
          ce=privacy.index('<div aria-live="polite"',cs)
          consent_markup=privacy[cs:ce]
          if 'id="consentBanner"' not in author:
              toast_i=author.index('<div id="toast"')
              author=author[:toast_i]+consent_markup+author[toast_i:]
          author_path.write_text(author,encoding='utf-8')

          # Canonical data model should point to the optimized assets actually used by the UI.
          data_path=Path('site-data.generated.json')
          data=json.loads(data_path.read_text(encoding='utf-8'))
          data['site']['release']=NEW_RELEASE
          data['site']['logo']=CANON+'/assets/covers/logo-freedom-book-redonda.webp'
          for b in data.get('books',[]):
              if b.get('slug')=='codigo-da-vida-inabalavel':
                  b['badge']='Próximo lançamento'
              if b.get('available'):
                  b['cover']=CANON+f"/assets/covers/capa-{b['slug']}.webp"
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # PWA chrome should match the V2.2.4/V2.2.5 visual palette.
          manifest_path=Path('manifest.webmanifest')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['background_color']='#050505'; manifest['theme_color']='#050505'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Runtime data-quality fixes: avoid double-counting catalog searches and clean
          # first-party optional cookies when the visitor revokes optional consent.
          js_path=Path('assets/app.v2.2.5.js')
          js=js_path.read_text(encoding='utf-8').replace(OLD_RELEASE,NEW_RELEASE)
          duplicate='    search?.addEventListener("change",()=>{const q=norm(search.value||"");if(q)track("catalog_search",{query_length:q.length,release:CONFIG.release})});\n'
          if duplicate not in js: raise SystemExit('expected duplicate catalog search listener not found')
          js=js.replace(duplicate,'')
          anchor='  let gaLoaded=false,tiktokLoaded=false,perfStarted=false;\n'
          cleanup='''  let gaLoaded=false,tiktokLoaded=false,perfStarted=false;\n  const OPTIONAL_COOKIE_PREFIXES=["_ga","_gcl_","_ttp","_tt_enable_cookie"];\n  const clearOptionalCookies=()=>{\n    const expired="Thu, 01 Jan 1970 00:00:00 GMT";\n    document.cookie.split(";").forEach(part=>{\n      const name=(part.split("=")[0]||"").trim();\n      if(!name||!OPTIONAL_COOKIE_PREFIXES.some(prefix=>name===prefix||name.startsWith(prefix)))return;\n      ["",location.hostname,`.`+location.hostname].forEach(domain=>{\n        document.cookie=`${name}=; expires=${expired}; Max-Age=0; path=/${domain?`; domain=${domain}`:""}`;\n      });\n    });\n  };\n'''
          if anchor not in js: raise SystemExit('consent runtime anchor missing')
          js=js.replace(anchor,cleanup,1)
          old_save='''  function saveConsent(next){\n    const requiresReload=(gaLoaded&&!next.analytics)||(tiktokLoaded&&!next.marketing);\n    consent={analytics:!!next.analytics,marketing:!!next.marketing};storage.set(CONSENT_KEY,JSON.stringify(consent));\n'''
          new_save='''  function saveConsent(next){\n    const previous={...consent};\n    const requiresReload=(gaLoaded&&!next.analytics)||(tiktokLoaded&&!next.marketing);\n    consent={analytics:!!next.analytics,marketing:!!next.marketing};\n    if((previous.analytics&&!consent.analytics)||(previous.marketing&&!consent.marketing))clearOptionalCookies();\n    storage.set(CONSENT_KEY,JSON.stringify(consent));\n'''
          if old_save not in js: raise SystemExit('saveConsent contract anchor missing')
          js=js.replace(old_save,new_save,1)
          js_path.write_text(js,encoding='utf-8')

          # README release label, if present.
          readme=Path('README.md')
          readme.write_text(readme.read_text(encoding='utf-8').replace(OLD_RELEASE,NEW_RELEASE),encoding='utf-8')

          # Upgrade the validator without weakening existing contracts.
          vp=Path('scripts/validate_site.py')
          v=vp.read_text(encoding='utf-8')
          v=v.replace("RELEASE='2026.09.08-v2.2.4'","RELEASE='2026.09.08-v2.2.5'")
          v=v.replace("CSS='/assets/style.v2.2.4.css'","CSS='/assets/style.v2.2.5.css'")
          v=v.replace("JS='/assets/app.v2.2.4.js'","JS='/assets/app.v2.2.5.js'")
          v=v.replace("not using V2.2.4 versioned assets","not using V2.2.5 versioned assets")
          v=v.replace("if '/assets/style.v2.2.3.css' in text or '/assets/app.v2.2.3.js' in text or '/assets/style.v2.2.css' in text or '/assets/app.v2.2.js' in text:\n        fail(f'{name}: stale active asset reference')",
                      "if '/assets/style.v2.2.4.css' in text or '/assets/app.v2.2.4.js' in text or '/assets/style.v2.2.3.css' in text or '/assets/app.v2.2.3.js' in text or '/assets/style.v2.2.css' in text or '/assets/app.v2.2.js' in text:\n        fail(f'{name}: stale active asset reference')")
          v=v.replace("for marker in ('V2.2.2 mobile performance hardening','content-visibility:auto','prefers-reduced-motion:reduce','V2.2.3 discovery/cache hardening','Freedom Book V2.2.4 — contextual premium editorial system'):",
                      "for marker in ('V2.2.2 mobile performance hardening','content-visibility:auto','prefers-reduced-motion:reduce','V2.2.3 discovery/cache hardening','Freedom Book V2.2.4 — contextual premium editorial system','Freedom Book V2.2.5 — error-correction hardening'):")
          v=v.replace("for required in ('index.html','autor-arthur-magnus.html','feed.xml','sitemap.xml','assets/style.v2.2.4.css','assets/app.v2.2.4.js','deploy-marker.json'):",
                      "for required in ('index.html','autor-arthur-magnus.html','feed.xml','sitemap.xml','assets/style.v2.2.5.css','assets/app.v2.2.5.js','deploy-marker.json'):")
          v=v.replace("if 'assets/style.v2.2.3.css' in art or 'assets/app.v2.2.3.js' in art:fail('release surface still contains prior active version assets')",
                      "if any(x in art for x in ('assets/style.v2.2.4.css','assets/app.v2.2.4.js','assets/style.v2.2.3.css','assets/app.v2.2.3.js')):fail('release surface still contains prior active version assets')")
          insertion="""
    if '#050505' not in text:fail(f'{name}: theme-color drift from active visual palette')
    if '/assets/favicon.ico' not in text or '/manifest.webmanifest' not in text:fail(f'{name}: browser/PWA identity assets missing')
    if 'fonts.googleapis.com' not in text:fail(f'{name}: typography contract missing')
    if 'id=\"consentBanner\"' not in text or 'id=\"cookiePrefs\"' not in text:fail(f'{name}: consent controls missing')
"""
          anchor="    if p.release!=[RELEASE]:fail(f'{name}: release mismatch {p.release}')\n"
          if insertion.strip() not in v:
              if anchor not in v: raise SystemExit('validator page-contract anchor missing')
              v=v.replace(anchor,anchor+insertion,1)
          data_guard="""
if data.get('site',{}).get('logo')!=CANON+'/assets/covers/logo-freedom-book-redonda.webp':fail('site-data optimized logo drift')
"""
          anchor2="if data.get('site',{}).get('release')!=RELEASE:fail('site-data release mismatch')\n"
          if data_guard.strip() not in v:
              v=v.replace(anchor2,anchor2+data_guard,1)
          cover_guard="""
        expected_cover=CANON+f'/assets/covers/capa-{slug}.webp'
        if b.get('cover')!=expected_cover:fail(f'{slug}: site-data optimized cover drift')
"""
          pdf_anchor="        pdf=b.get('pdfUrl','')\n"
          if cover_guard.strip() not in v:
              v=v.replace(pdf_anchor,cover_guard+pdf_anchor,1)
          extra_home="""
if 'Códigos de Vida · Códigos de Vida' in home:fail('duplicated upcoming taxonomy label')
"""
          home_anchor="if 'autor-arthur-magnus#person' not in home:fail('home author entity missing')\n"
          if extra_home.strip() not in v:
              v=v.replace(home_anchor,home_anchor+extra_home,1)
          js_guard="""
if 'search?.addEventListener(\"change\"' in js:fail('duplicate catalog search analytics listener reintroduced')
if 'clearOptionalCookies' not in js:fail('optional-cookie revocation cleanup missing')
"""
          utm_anchor="if 'utm_source' in js or 'utm_medium' in js or 'utm_campaign' in js:fail('raw UTM capture is forbidden')\n"
          if js_guard.strip() not in v:
              v=v.replace(utm_anchor,utm_anchor+js_guard,1)
          manifest_guard="""
if manifest.get('background_color')!='#050505' or manifest.get('theme_color')!='#050505':fail('manifest theme palette drift')
"""
          manifest_anchor="manifest=json.loads((ROOT/'manifest.webmanifest').read_text('utf-8'))\n"
          if manifest_guard.strip() not in v:
              v=v.replace(manifest_anchor,manifest_anchor+manifest_guard,1)
          vp.write_text(v,encoding='utf-8')

          # Upgrade CI and production smoke to the active assets and new regressions.
          sip=Path('.github/workflows/site-integrity.yml')
          si=sip.read_text(encoding='utf-8')
          si=si.replace('assets/style.v2.2.4.css','assets/style.v2.2.5.css').replace('assets/app.v2.2.4.js','assets/app.v2.2.5.js')
          si=si.replace("old=('/assets/style.v2.2.css','/assets/app.v2.2.js','/assets/style.v2.2.3.css','/assets/app.v2.2.3.js')",
                        "old=('/assets/style.v2.2.css','/assets/app.v2.2.js','/assets/style.v2.2.3.css','/assets/app.v2.2.3.js','/assets/style.v2.2.4.css','/assets/app.v2.2.4.js')")
          si=si.replace('missing V2.2.4 asset reference','missing V2.2.5 asset reference').replace('V2.2.4 versioned asset references','V2.2.5 versioned asset references')
          sip.write_text(si,encoding='utf-8')

          psp=Path('.github/workflows/production-smoke.yml')
          ps=psp.read_text(encoding='utf-8').replace('FreedomBook-Production-Smoke/2.2.4','FreedomBook-Production-Smoke/2.2.5')
          ps=ps.replace('/assets/style.v2.2.4.css','/assets/style.v2.2.5.css').replace('/assets/app.v2.2.4.js','/assets/app.v2.2.5.js')
          neg="""          ! grep -q '/assets/style.v2.2.4.css' /tmp/home.html
          ! grep -q '/assets/app.v2.2.4.js' /tmp/home.html
"""
          marker="          ! grep -q '/assets/style.v2.2.3.css' /tmp/home.html\n"
          if neg.strip() not in ps:
              ps=ps.replace(marker,neg+marker,1)
          author_checks="""          grep -q 'fonts.googleapis.com' /tmp/author.html
          grep -q 'id=\"consentBanner\"' /tmp/author.html
          grep -q 'id=\"cookiePrefs\"' /tmp/author.html
          grep -q 'property=\"og:title\"' /tmp/author.html
"""
          marker2="          grep -q '/assets/covers/logo-freedom-book-redonda.webp' /tmp/author.html\n"
          if author_checks.strip() not in ps:
              ps=ps.replace(marker2,marker2+author_checks,1)
          psp.write_text(ps,encoding='utf-8')

          # Release surface: rotate active asset names and hash the exact candidate bytes.
          rp=Path('release.json')
          release=json.loads(rp.read_text(encoding='utf-8'))
          release['release']=NEW_RELEASE
          art=release.get('artifacts',{})
          art.pop('assets/style.v2.2.4.css',None); art.pop('assets/app.v2.2.4.js',None)
          art['assets/style.v2.2.5.css']=''; art['assets/app.v2.2.5.js']=''
          for rel in list(art):
              f=Path(rel)
              if not f.is_file(): raise SystemExit(f'missing release artifact: {rel}')
              art[rel]=hashlib.sha256(f.read_bytes()).hexdigest()
          release['artifacts']=dict(sorted(art.items()))
          rp.write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          node --check assets/app.v2.2.5.js
          python3 scripts/validate_site.py

          rm -f .v225-fix-ready
          git rm .github/workflows/apply-v225-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct V2.2.5 visual, consent and telemetry drift"
          git push origin HEAD:fix/v2-2-5-errors
