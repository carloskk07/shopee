name: Monetization native v2

on:
  push:
    branches: [monetization/native-control-plane-v1]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout campaign branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run corrected campaign
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/data\.monetizationSlot/dataset.monetizationSlot/g' .github/workflows/monetization-native-v1.yml
          awk 'found && $0=="          PY"{exit} /python3 - <<'\''PY'\''/{found=1;next} found{print}' .github/workflows/monetization-native-v1.yml | sed 's/^          //' > /tmp/monetization-build.py
          python3 /tmp/monetization-build.py
          python3 scripts/release_hashes.py --write
          python3 scripts/validate_monetization.py
          python3 scripts/validate_site.py
          python3 scripts/validate_seo.py
          python3 scripts/validate_guides.py
          python3 scripts/test_seo_intelligence.py
          node --check assets/app.v2.2.5.js
          node --check assets/monetization.v1.js
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check

      - name: Commit validated campaign and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/monetization-native-v1.yml .github/workflows/monetization-native-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: monetização nativa support-first"
          git push origin HEAD:monetization/native-control-plane-v1
