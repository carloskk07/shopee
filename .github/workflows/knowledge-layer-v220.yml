name: Knowledge Layer V2.2

on:
  push:
    branches: [admin/knowledge-layer-v2.2]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Knowledge Layer patch
        run: python3 tmp/patch_knowledge_v220.py

      - name: Validate Knowledge Layer and full product
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_admin.py scripts/validate_knowledge.py scripts/validate_site.py scripts/validate_seo.py scripts/generate-route-shims.py
          python3 scripts/validate_knowledge.py
          python3 scripts/validate_admin.py
          node --check admin/app.js
          node --check admin/book-publisher.js
          node --check admin/knowledge-layer.js
          node scripts/test_admin_v2.js
          python3 scripts/release_hashes.py --changed-only
          python3 scripts/validate_site.py
          python3 scripts/validate_seo.py
          python3 scripts/validate_guides.py
          python3 scripts/test_seo_intelligence.py
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check

      - name: Commit validated Knowledge Layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html admin/control-plane.json admin/release.json admin/knowledge.json admin/knowledge-layer.js scripts/validate_admin.py scripts/validate_knowledge.py .github/workflows/admin-integrity.yml .github/workflows/admin-production-smoke.yml
          git commit -m "feat: integrar Knowledge Layer V2.2"
          git push origin HEAD:admin/knowledge-layer-v2.2
