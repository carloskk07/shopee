name: FCC V2 boot hotfix

on:
  push:
    branches: [admin/fix-boot-overlay-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch hidden contract, add regression and refresh release hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          css_path = Path('admin/style.css')
          css = css_path.read_text(encoding='utf-8')
          guard = '[hidden]{display:none!important}'
          if guard not in css:
              needle = '*{box-sizing:border-box}'
              assert css.count(needle) == 1, f'unexpected CSS anchor count: {css.count(needle)}'
              css = css.replace(needle, needle + guard, 1)
              css_path.write_text(css, encoding='utf-8')

          test_path = Path('scripts/test_admin_v2.js')
          test = test_path.read_text(encoding='utf-8')
          assertion = "const css=fs.readFileSync(require('path').join(__dirname,'../admin/style.css'),'utf8');\nassert(css.includes('[hidden]{display:none!important}'),'hidden attribute must override component display');\n"
          if 'hidden attribute must override component display' not in test:
              anchor = "function assert(condition,message){if(!condition)throw new Error(message)}\n"
              assert test.count(anchor) == 1, 'test anchor mismatch'
              test = test.replace(anchor, "const fs=require('fs');\n" + anchor + "\n" + assertion, 1)
              test_path.write_text(test, encoding='utf-8')

          release_path = Path('admin/release.json')
          release = json.loads(release_path.read_text(encoding='utf-8'))
          digest = hashlib.sha256(css_path.read_bytes()).hexdigest()
          release['artifacts']['style.css'] = digest
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('style.css sha256', digest)
          PY

          python3 -m py_compile scripts/validate_admin.py
          python3 scripts/validate_admin.py
          node --check admin/app.js
          node scripts/test_admin_v2.js
          python3 scripts/release_hashes.py --changed-only
          python3 scripts/validate_site.py
          python3 scripts/validate_seo.py
          python3 scripts/validate_guides.py
          python3 scripts/test_seo_intelligence.py
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/style.css admin/release.json scripts/test_admin_v2.js
          git diff --cached --check
          git commit -m 'fix: encerrar overlay de inicialização do Control Center V2'
          git push origin HEAD:${GITHUB_REF_NAME}
