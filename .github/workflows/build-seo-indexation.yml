name: Build SEO indexation hardening

on:
  push:
    branches: ['seo/indexation-authority-v1']
    paths: ['.seo/READY']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply deterministic SEO hardening
        run: python3 scripts/apply-seo-hardening.py
      - name: Refresh cryptographic release surface
        run: python3 scripts/refresh_release.py
      - name: Validate existing site contract
        run: python3 scripts/validate_site.py
      - name: Validate SEO/indexation contract
        run: python3 scripts/validate_seo.py
      - name: Validate route compatibility contract
        run: |
          node scripts/test-route-recovery.cjs
          python3 scripts/generate-route-shims.py --check
      - name: Commit generated SEO surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .seo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html autor-arthur-magnus.html *.html sitemap.xml site-data.generated.json maintenance-marker.json release.json
          git commit -m 'seo: harden indexation, entities and internal discovery'
          git push origin HEAD:seo/indexation-authority-v1
