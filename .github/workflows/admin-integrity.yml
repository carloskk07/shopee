name: Admin integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Freedom Control Center V2.2.0
        run: |
          python3 -m py_compile scripts/validate_admin.py scripts/validate_knowledge.py scripts/validate_site.py scripts/validate_seo.py scripts/generate-route-shims.py scripts/build_private_admin.py
          python3 scripts/validate_admin.py
          python3 scripts/validate_knowledge.py
          node --check admin/app.js
          node --check admin/book-publisher.js
          node --check admin/knowledge-layer.js
          node scripts/test_admin_v2.js

      - name: Validate private Netlify runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_private_admin.py
          test -f netlify-admin-dist/admin/runtime-adapter.js
          test -f netlify-admin-dist/admin/release.json
          test -f netlify-admin-dist/release.json
          grep -q "netlify-private" netlify-admin-dist/admin/runtime-adapter.js
          grep -q "team-sso" netlify-admin-dist/admin/runtime-adapter.js
          test "$(grep -c '/admin/knowledge-layer.js' netlify-admin-dist/admin/index.html)" -eq 1
          test "$(grep -c '/admin/runtime-adapter.js' netlify-admin-dist/admin/index.html)" -eq 1
          cmp -s release.json netlify-admin-dist/release.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('netlify-admin-dist/admin')
          rel=json.loads((root/'release.json').read_text())
          assert rel['schema']=='freedom-admin-release-v1'
          assert rel['version']=='2.2.0'
          assert rel['hosting']=='netlify-private'
          assert rel['access']=='team-sso'
          assert 'runtime-adapter.js' in rel['artifacts']
          for name,expected in rel['artifacts'].items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          print('Private runtime release exact')
          PY

      - name: Enforce admin isolation and budgets
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s admin/index.html)" -lt 22000
          test "$(stat -c%s admin/style.css)" -lt 42000
          test "$(stat -c%s admin/app.js)" -lt 90000
          test "$(stat -c%s admin/book-publisher.js)" -lt 50000
          test "$(stat -c%s admin/control-plane.json)" -lt 16000
          test "$(stat -c%s admin/knowledge.json)" -lt 18000
          test "$(stat -c%s admin/knowledge-layer.js)" -lt 18000
          grep -q 'Freedom Control Center · V2' admin/index.html
          grep -q 'bookPublisherDialog' admin/index.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' admin/index.html
          grep -q '/admin/knowledge-layer.js' admin/index.html
          grep -q 'freedom-control-plane-v2' admin/control-plane.json
          grep -q '"version": "2.2.0"' admin/control-plane.json
          grep -q 'directMainWrites.*false' admin/control-plane.json
          grep -q 'memory-only' admin/control-plane.json
          grep -q 'technical-normalized-v1' admin/control-plane.json
          grep -q 'searchEvidenceScoring.*false' admin/control-plane.json
          grep -q 'historicalRunsScoring.*false' admin/control-plane.json
          grep -q 'optionalWorkflows' admin/control-plane.json
          grep -q 'freedom-knowledge-layer-v1' admin/knowledge.json
          grep -q 'PRIVATE_SESSION_ONLY' admin/knowledge.json
          grep -q '__FCC_KNOWLEDGE_LAYER__' admin/knowledge-layer.js
          grep -q 'CI_CURRENT_RELEASE' admin/app.js
          grep -q 'NOT_LOADED' admin/app.js
          grep -q 'historicalFailed' admin/app.js
          grep -q 'operationalReadiness' admin/app.js
          grep -q 'optionalRuns' admin/app.js
          grep -q 'binaryStaged' admin/app.js
          grep -q '__FCC_PUBLISHER_API__' admin/app.js
          grep -q 'stageBook' admin/book-publisher.js
          grep -q '%PDF-' admin/book-publisher.js
          grep -q 'image/webp' admin/book-publisher.js
          grep -q '^exclude:' _config.yml
          grep -q '  - admin' _config.yml
          grep -q 'scripts/build_private_admin.py' netlify.toml
          ! grep -q '/admin' sitemap.xml
          ! grep -Rqi 'github_pat_' admin scripts/validate_admin.py scripts/validate_knowledge.py scripts/build_private_admin.py
          ! grep -Rq 'localStorage' admin
          ! grep -Rq 'document.cookie' admin
          ! grep -Rq 'googletagmanager.com' admin
          ! grep -Rq 'analytics.tiktok.com' admin
          ! grep -Rq 'NEXT_PUBLIC_' admin

      - name: Verify scoped V2.2.0 mutation contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "$changed"
            bad="$(printf '%s\n' "$changed" | grep -Ev '(^admin/|^scripts/(validate_admin|validate_knowledge|test_admin_v2|validate_site|validate_seo|generate-route-shims|build_private_admin)\.(py|js)$|^\.github/workflows/admin-(integrity|production-smoke)\.yml$|^netlify\.toml$|^_config\.yml$)' || true)"
            test -z "$bad" || { echo "Control Center V2.2.0 touched files outside its approved dependency surface:"; echo "$bad"; exit 1; }
          fi
