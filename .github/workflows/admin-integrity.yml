name: Admin integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Freedom Control Center V2.2 + Operational Brain
        run: |
          python3 -m py_compile scripts/validate_admin.py scripts/validate_knowledge.py scripts/validate_site.py scripts/validate_seo.py scripts/validate_monetization.py scripts/generate-route-shims.py scripts/build_private_admin.py
          python3 scripts/validate_admin.py
          python3 scripts/validate_knowledge.py
          python3 scripts/validate_monetization.py
          node --check admin/app.js
          node --check admin/book-publisher.js
          node --check admin/knowledge-layer.js
          node --check admin/operational-brain.js
          node --check admin/monetization-intelligence.js
          node scripts/test_admin_v2.js

      - name: Validate private Netlify runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_private_admin.py
          test -f netlify-admin-dist/admin/runtime-adapter.js
          test -f netlify-admin-dist/admin/operational-brain.js
          test -f netlify-admin-dist/admin/monetization-intelligence.js
          test -f netlify-admin-dist/admin/release.json
          test -f netlify-admin-dist/release.json
          test -f netlify-admin-dist/monetization.json
          test -f netlify-admin-dist/site-data.generated.json
          grep -q "netlify-private" netlify-admin-dist/admin/runtime-adapter.js
          grep -q "team-sso" netlify-admin-dist/admin/runtime-adapter.js
          grep -q '/api/github/publish' netlify-admin-dist/admin/app.js
          grep -q '__FCC_SERVER_GITHUB_READY__' netlify-admin-dist/admin/app.js
          grep -q 'freedom-decision-context-v1' netlify-admin-dist/admin/app.js
          grep -q 'WAITING_FINALIZED_GSC' netlify-admin-dist/admin/app.js
          grep -q '/api/monetization/ledger' netlify-admin-dist/admin/monetization-intelligence.js
          grep -q 'Monetization Intelligence V2' netlify-admin-dist/admin/monetization-intelligence.js
          test "$(grep -c '/admin/knowledge-layer.js' netlify-admin-dist/admin/index.html)" -eq 1
          test "$(grep -c '/admin/runtime-adapter.js' netlify-admin-dist/admin/index.html)" -eq 1
          test "$(grep -c '/admin/operational-brain.js' netlify-admin-dist/admin/index.html)" -eq 1
          test "$(grep -c '/admin/monetization-intelligence.js' netlify-admin-dist/admin/index.html)" -eq 1
          cmp -s release.json netlify-admin-dist/release.json
          cmp -s monetization.json netlify-admin-dist/monetization.json
          cmp -s site-data.generated.json netlify-admin-dist/site-data.generated.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('netlify-admin-dist/admin')
          rel=json.loads((root/'release.json').read_text())
          assert rel['schema']=='freedom-admin-release-v1'
          assert rel['version']=='2.2.0'
          assert rel['hosting']=='netlify-private'
          assert rel['access']=='team-sso'
          for cap in ('operational-brain','closed-loop-decisions','causal-experiment-windows','decision-ledger','monetization-intelligence','private-monetization-ledger','audit-trail','gsc-auto-ready','github-server-publish-ready'):
              assert cap in rel['capabilities'],cap
          assert {'runtime-adapter.js','operational-brain.js','monetization-intelligence.js'} <= set(rel['artifacts'])
          for name,expected in rel['artifacts'].items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          print('Private runtime release exact')
          PY

      - name: Validate private backend contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f netlify/functions/brain-status.mts
          test -f netlify/functions/brain-evaluate.mts
          test -f netlify/functions/decision-ledger.mts
          test -f netlify/functions/monetization-ledger.mts
          test -f netlify/functions/github-publish.mts
          test -f netlify/functions/gsc-data.mts
          test -f netlify/functions/gsc-sync.mts
          test -f netlify/functions/gsc-scheduled.mts
          test -f netlify/functions/audit.mts
          test -f netlify/lib/audit.mts
          test -f netlify/lib/gsc.mts
          test -f netlify/lib/decision-engine.mts
          test -f netlify/lib/monetization-ledger.mts
          grep -q '@netlify/blobs' package.json
          grep -q 'directory = "netlify/functions"' netlify.toml
          grep -q "schedule:'0 10 \* \* \*'" netlify/functions/gsc-scheduled.mts
          grep -q 'FCC_GITHUB_TOKEN' netlify/functions/github-publish.mts
          grep -q 'GSC_REFRESH_TOKEN' netlify/lib/gsc.mts
          grep -q 'getStore' netlify/lib/audit.mts
          grep -q 'getDeployStore' netlify/lib/audit.mts
          grep -q 'getStore' netlify/lib/decision-engine.mts
          grep -q 'getDeployStore' netlify/lib/decision-engine.mts
          grep -q 'getStore' netlify/lib/monetization-ledger.mts
          grep -q 'getDeployStore' netlify/lib/monetization-ledger.mts
          grep -q 'finalizedDecisionReached' netlify/lib/decision-engine.mts
          grep -q 'recordDecision' netlify/functions/decision-ledger.mts
          grep -q '/api/monetization/ledger' netlify/functions/monetization-ledger.mts
          grep -q 'monetization_revenue_recorded' netlify/functions/monetization-ledger.mts
          grep -q 'FCC_DECISION_CONTEXT' netlify/functions/github-publish.mts
          grep -q 'PR-only' netlify/functions/github-publish.mts
          ! grep -RqiE 'github_pat_[A-Za-z0-9_]{10,}|ghp_[A-Za-z0-9]{10,}' netlify admin/operational-brain.js admin/monetization-intelligence.js

      - name: Enforce admin isolation and budgets
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s admin/index.html)" -lt 22000
          test "$(stat -c%s admin/style.css)" -lt 42000
          test "$(stat -c%s admin/app.js)" -lt 90000
          test "$(stat -c%s admin/book-publisher.js)" -lt 50000
          test "$(stat -c%s admin/operational-brain.js)" -lt 30000
          test "$(stat -c%s admin/monetization-intelligence.js)" -lt 36000
          test "$(stat -c%s admin/control-plane.json)" -lt 18000
          test "$(stat -c%s admin/knowledge.json)" -lt 22000
          test "$(stat -c%s admin/knowledge-layer.js)" -lt 18000
          grep -q 'Freedom Control Center · V2' admin/index.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' admin/index.html
          grep -q 'freedom-control-plane-v2' admin/control-plane.json
          grep -q '"version": "2.2.0"' admin/control-plane.json
          grep -q 'directMainWrites.*false' admin/control-plane.json
          grep -q 'memory-only' admin/control-plane.json
          grep -q 'technical-normalized-v1' admin/control-plane.json
          grep -q 'freedom-closed-loop-policy-v1' admin/control-plane.json
          grep -q 'freedom-monetization-intelligence-policy-v1' admin/control-plane.json
          grep -q 'UNKNOWN_NOT_ZERO' admin/control-plane.json
          grep -q 'requireFinalizedDataThroughDecisionDate' admin/control-plane.json
          grep -q 'netlify-private-blobs' admin/control-plane.json
          grep -q '__FCC_KNOWLEDGE_LAYER__' admin/knowledge-layer.js
          grep -q '__FCC_OPERATIONAL_BRAIN__' admin/operational-brain.js
          grep -q '/api/brain/evaluate' admin/operational-brain.js
          grep -q '/api/gsc/data' admin/operational-brain.js
          grep -q '/api/decision/ledger' admin/operational-brain.js
          grep -q 'Operational Brain V2' admin/operational-brain.js
          grep -q '__FCC_MONETIZATION_INTELLIGENCE__' admin/monetization-intelligence.js
          grep -q '/api/monetization/ledger' admin/monetization-intelligence.js
          grep -q 'PRIVATE ECONOMIC LAYER' admin/monetization-intelligence.js
          grep -q 'binaryStaged' admin/app.js
          grep -q '__FCC_PUBLISHER_API__' admin/app.js
          grep -q 'stageBook' admin/book-publisher.js
          grep -q '^exclude:' _config.yml
          grep -q '  - admin' _config.yml
          ! grep -q '/admin' sitemap.xml
          ! grep -Rqi 'github_pat_' admin scripts netlify
          ! grep -Rq 'localStorage' admin
          ! grep -Rq 'document.cookie' admin
          ! grep -Rq 'googletagmanager.com' admin
          ! grep -Rq 'analytics.tiktok.com' admin
          ! grep -Rq 'NEXT_PUBLIC_' admin

      - name: Verify scoped admin mutation contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "$changed"
            bad="$(printf '%s\n' "$changed" | grep -Ev '(^admin/|^netlify/|^monetization\.json$|^release\.json$|^freedom-book-admin/index\.html$|^privacidade-freedom-book-admin/index\.html$|^scripts/(validate_admin|validate_knowledge|validate_monetization|test_admin_v2|validate_site|validate_seo|generate-route-shims|build_private_admin)\.(py|js)$|^\.github/workflows/admin-(integrity|production-smoke)\.yml$|^netlify\.toml$|^_config\.yml$|^package\.json$|^\.gitignore$)' || true)"
            test -z "$bad" || { echo "Admin campaign touched files outside its approved dependency surface:"; echo "$bad"; exit 1; }
          fi
